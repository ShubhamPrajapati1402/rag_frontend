<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Metallic Sphere Gradient matching Chat & Login -->
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#9ca3af"/>
      <stop offset="70%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- White Glow Filter for Planets and Rings -->
    <filter id="whiteGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .gyro-ring {
      fill: none;
      stroke: rgba(255, 255, 255, 0.85);
      stroke-width: 1.1;
      stroke-dasharray: 2 2.5;
    }
    .gyro-ring-glow {
      fill: none;
      stroke: rgba(255, 255, 255, 0.35);
      stroke-width: 2.2;
    }
    .planet {
      fill: #ffffff;
      filter: url(#whiteGlow);
    }
  </style>

  <!-- Ambient central glow -->
  <circle cx="32" cy="32" r="26" fill="url(#ambientGlow)" />

  <!-- 1. Equatorial Ring (0 deg) -->
  <g transform="rotate(0 32 32)">
    <ellipse cx="32" cy="32" rx="25" ry="9" class="gyro-ring-glow" />
    <ellipse cx="32" cy="32" rx="25" ry="9" class="gyro-ring" />
    <circle r="3" class="planet">
      <animateMotion dur="10s" repeatCount="indefinite" path="M 7,32 a 25,9 0 1,0 50,0 a 25,9 0 1,0 -50,0" />
    </circle>
  </g>

  <!-- 2. +45 deg Tilted Ring -->
  <g transform="rotate(45 32 32)">
    <ellipse cx="32" cy="32" rx="25" ry="9" class="gyro-ring-glow" />
    <ellipse cx="32" cy="32" rx="25" ry="9" class="gyro-ring" />
    <circle r="3" class="planet">
      <animateMotion dur="7.5s" repeatCount="indefinite" path="M 7,32 a 25,9 0 1,0 50,0 a 25,9 0 1,0 -50,0" />
    </circle>
  </g>

  <!-- 3. -45 deg Tilted Ring -->
  <g transform="rotate(-45 32 32)">
    <ellipse cx="32" cy="32" rx="25" ry="9" class="gyro-ring-glow" />
    <ellipse cx="32" cy="32" rx="25" ry="9" class="gyro-ring" />
    <circle r="3" class="planet">
      <animateMotion dur="8.8s" repeatCount="indefinite" path="M 57,32 a 25,9 0 1,0 -50,0 a 25,9 0 1,0 50,0" />
    </circle>
  </g>

  <!-- 4. 90 deg Polar Ring -->
  <g transform="rotate(90 32 32)">
    <ellipse cx="32" cy="32" rx="25" ry="9" class="gyro-ring-glow" />
    <ellipse cx="32" cy="32" rx="25" ry="9" class="gyro-ring" />
    <circle r="2.8" class="planet">
      <animateMotion dur="6.2s" repeatCount="indefinite" path="M 7,32 a 25,9 0 1,0 50,0 a 25,9 0 1,0 -50,0" />
    </circle>
  </g>

  <!-- Central Metallic Volumetric Sphere with Lucide Brain Icon -->
  <g>
    <!-- Outer sphere rim glow & shadow -->
    <circle cx="32" cy="32" r="9" fill="#000000" opacity="0.4" filter="url(#whiteGlow)"/>
    <!-- Metallic gradient body -->
    <circle cx="32" cy="32" r="8.5" fill="url(#sphereGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
    <!-- Central Brain Icon (Pure White #ffffff) -->
    <g transform="translate(26, 26) scale(0.5)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
      <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
      <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
      <path d="M12 18v4"/>
      <path d="M12 5v1"/>
    </g>
  </g>
</svg>